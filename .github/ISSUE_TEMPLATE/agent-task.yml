name: Agent task
description: Work for the dev VM agents. Assigned automatically unless you pick someone.
labels: ["agent-ready"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Code
        - Research / docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Checklist the reviewer will verify. Needs a credential or an Infisical project? Follow
        setkernel/hq docs/repo-standard.md, section "Credentials for a repo"; do not ask Raghav to
        create tokens in a dashboard.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / pointers
      description: Files, links, constraints, things not to touch.
